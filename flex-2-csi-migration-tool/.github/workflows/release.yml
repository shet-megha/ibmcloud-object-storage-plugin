name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Run tests
        run: |
          go mod tidy
          go test -v -race ./...

      - name: Run go vet
        run: go vet ./...

  build:
    name: Build and Release
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
            platform: linux-amd64
          - goos: linux
            goarch: arm64
            platform: linux-arm64
          # macOS builds
          - goos: darwin
            goarch: amd64
            platform: darwin-amd64
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
          # Windows build
          - goos: windows
            goarch: amd64
            platform: windows-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Build the binary
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="kubectl-flex-to-csi.exe"
          else
            BINARY_NAME="kubectl-flex-to-csi"
          fi
          
          go build -ldflags "-X main.Version=${VERSION}" -o ${BINARY_NAME} cmd/kubectl-flex-to-csi/main.go
          
          # Create distribution directory
          DIST_DIR="kubectl-flex-to-csi-${VERSION}-${{ matrix.platform }}"
          mkdir -p ${DIST_DIR}/kubeconfig
          
          # Copy files
          cp ${BINARY_NAME} ${DIST_DIR}/
          cp LAUNCHER_README.md ${DIST_DIR}/
          cp dist-template/kubeconfig/README.md ${DIST_DIR}/kubeconfig/
          
          # Copy appropriate launcher script
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp run.bat ${DIST_DIR}/
          else
            cp run.command ${DIST_DIR}/run.sh
            chmod +x ${DIST_DIR}/run.sh
            chmod +x ${DIST_DIR}/${BINARY_NAME}
          fi
          
          # Create archive
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r ${DIST_DIR}.zip ${DIST_DIR}
            echo "ASSET_PATH=${DIST_DIR}.zip" >> $GITHUB_ENV
          else
            tar -czf ${DIST_DIR}.tar.gz ${DIST_DIR}
            echo "ASSET_PATH=${DIST_DIR}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Generate checksum
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            sha256sum kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.zip > kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.zip.sha256
          else
            sha256sum kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.tar.gz > kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.tar.gz.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}
          path: |
            kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release-assets/ \;
          
          # Create combined checksums file
          cd release-assets
          cat *.sha256 > checksums.txt
          cd ..

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## kubectl-flex-to-csi ${{ steps.version.outputs.VERSION }}
          
          ### 📦 Downloads
          
          Choose the appropriate package for your platform:
          
          #### Linux
          - **AMD64 (x86_64)**: `kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz`
          - **ARM64**: `kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz`
          
          #### macOS
          - **Intel (AMD64)**: `kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz`
          - **Apple Silicon (ARM64)**: `kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz`
          
          #### Windows
          - **AMD64 (x86_64)**: `kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-windows-amd64.zip`
          
          ### 🔐 Verification
          
          All packages include SHA256 checksums. Verify your download:
          
          ```bash
          # Linux/macOS
          sha256sum -c kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz.sha256
          
          # Or check against checksums.txt
          sha256sum kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
          grep linux-amd64 checksums.txt
          ```
          
          ### 🚀 Quick Start
          
          ```bash
          # Linux/macOS - Extract and run
          tar -xzf kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
          cd kubectl-flex-to-csi-${{ steps.version.outputs.VERSION }}-linux-amd64
          ./run.sh
          
          # Windows - Extract and run
          # Extract the zip file
          # Double-click run.bat or run in PowerShell
          ```
          
          ### 📝 What's Changed
          
          See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          
          ### 🐛 Bug Reports
          
          Please report issues at: https://github.com/${{ github.repository }}/issues
          EOF
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## 🎉 Release ${{ steps.version.outputs.VERSION }} Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh release-assets/ | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Release Page](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.VERSION }})" >> $GITHUB_STEP_SUMMARY
          echo "- [All Releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY

